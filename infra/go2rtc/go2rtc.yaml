# go2rtc: one connection per camera, re-served to the vision worker, the clip recorder and the
# dashboard (docs/07-video-pipeline.md). Streams aren't listed here: the core adds one pair per
# camera through the API (<camera id> and <camera id>_hd; services/core/cameras/service.py).
log:
  level: warn

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
