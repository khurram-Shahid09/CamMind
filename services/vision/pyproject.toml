[project]
name = "cammind-vision"
version = "0.1.0"
description = "CamMind vision worker: RTSP -> motion -> detection -> tracking -> rule engine -> events"
requires-python = ">=3.13,<3.14"
dependencies = [
    "av",
    "cammind-spec",
    "httpx",
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "pydantic",
    "supervision",
    "tzdata",
]

[project.scripts]
cammind-vision = "cammind_vision.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Versions policy (docs/04-tech-stack.md): never adopt a release younger than 2 weeks.
exclude-newer = "2026-09-20T00:00:00Z"

[tool.uv.sources]
cammind-spec = { path = "../../packages/cammind-spec", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
